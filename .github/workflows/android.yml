name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'editor/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Renombrar APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/EditaYa-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/EditaYa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EditaYa-apk
          path: out/*.apk
